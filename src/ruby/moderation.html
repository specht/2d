<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Moderation – 2D Game Studio</title>
<!--
    The temporary moderation page (./moderate.rb web, main.rb /moderation/:token,
    rules in moderation.rb). Not in src/static: nginx never serves it, only the
    server with an open session. It opens Live: every few seconds the versions
    saved since bring their new pictures and texts on top (page_stream), and
    beside them today's open Fehlerberichte with the text of ./errors.rb show
    to copy (client_errors.rb dashboard) – a workshop at a glance. Everything a game holds is shown as text
    (textContent), never as HTML.
-->
<style>
    :root {
        --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #69707d; --line: #dde0e6;
        --accent: #2a6fdb; --danger: #c62828; --danger-bg: #fdecec; --ok: #2e7d32; --mark: #ffe082;
        --check-a: #e9ebef; --check-b: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #15181e; --card: #1f232b; --text: #e6e8ec; --muted: #9aa1ad; --line: #333945;
            --accent: #6ea3ff; --danger: #ff6b6b; --danger-bg: #3a1f22; --ok: #7bd389; --mark: #8a6d00;
            --check-a: #2a2f38; --check-b: #343a45;
        }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 20px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0; }
    #clock { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
    form { display: flex; gap: 8px; flex: 1 1 360px; }
    input[type=search], input[type=text] { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    button.danger.light { background: transparent; color: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    label { color: var(--muted); user-select: none; cursor: pointer; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 60px; }
    #status { color: var(--muted); margin: 4px 0 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .card.gone { opacity: .55; }
    .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
    .tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); }
    .name { font-weight: 600; }
    .meta { color: var(--muted); font-size: 13px; }
    .badge { font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
    .badge.saved { color: var(--ok); border-color: currentColor; }
    .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .actions a { color: var(--accent); text-decoration: none; font-size: 14px; }
    .frames { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    /* the picture fills its tile, scaled up without smoothing (the sprites are small) */
    .frames button { width: 80px; height: 80px; padding: 0; display: block; overflow: hidden; border-radius: 6px;
        background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 12px 12px; }
    .frames img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .texts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .texts span { font-size: 13px; padding: 1px 7px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); max-width: 100%; overflow-wrap: anywhere; }
    .hits { margin: 8px 0 0; padding: 0; list-style: none; font-size: 14px; }
    .hits li { padding: 2px 0; overflow-wrap: anywhere; }
    .hits .where { color: var(--muted); }
    mark { background: var(--mark); color: inherit; border-radius: 2px; }
    .none { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .confirm { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--danger-bg); display: grid; gap: 8px; }
    .confirm .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .confirm label { color: var(--text); }
    .result { margin-top: 8px; color: var(--ok); }
    .error { color: var(--danger); }
    #more { display: block; margin: 16px auto; }
    [hidden] { display: none !important; }
    /* Live: what is new, as it is saved – bigger, to be seen at a glance */
    button.live { display: inline-flex; align-items: center; gap: 6px; }
    button.live.on { border-color: var(--danger); color: var(--danger); font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
    button.live.on .dot, #status .dot.on { background: var(--danger); animation: pulse 1.6s ease-in-out infinite; }
    #status .dot.paused { background: var(--muted); animation: none; }
    @keyframes pulse { 50% { opacity: .3; } }
    .card.live .frames button { width: 128px; height: 128px; }
    .card.live .texts span { font-size: 16px; padding: 3px 9px; }
    .card.live .head .time { font-variant-numeric: tabular-nums; font-weight: 600; }
    .card.fresh { animation: fresh 6s ease-out; }
    @keyframes fresh { from { background: var(--mark); } to { background: var(--card); } }
    body.dashboard header .bar { max-width: 1680px; }
    main.dashboard { max-width: 1680px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 0 20px; align-items: start; }
    main.dashboard > #status { grid-column: 1 / -1; }
    main.dashboard > #games, main.dashboard > #more { grid-column: 1; }
    #errors { grid-column: 2; grid-row: 2 / span 2; position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    @media (max-width: 1000px) {
        main.dashboard { grid-template-columns: minmax(0, 1fr); }
        /* one column: the errors above the stream */
        main.dashboard > #status { order: -2; }
        #errors { grid-column: 1; grid-row: auto; order: -1; position: static; max-height: 40vh; margin-bottom: 14px; }
    }
    #errors h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
    #errors h2 .count { color: var(--danger); }
    #errors .tools { margin-left: auto; display: flex; gap: 6px; }
    #errors .tools button, .err button { font-size: 13px; padding: 3px 9px; }
    #errors .hint { color: var(--muted); font-size: 13px; margin: 6px 0 2px; }
    .err { border-top: 1px solid var(--line); padding: 8px 0; }
    .err:first-of-type { border-top: none; }
    .err .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .err .id { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); }
    .err .n { font-weight: 700; }
    .err .msg { color: var(--danger); overflow-wrap: anywhere; margin: 2px 0; }
    .err .badge.again { color: var(--danger); border-color: currentColor; font-weight: 600; }
    .err .row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .err .row .done { margin-left: auto; color: var(--ok); }
    .err .row .done:hover { border-color: var(--ok); }
    .err pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border-radius: 6px; font-size: 12px; white-space: pre-wrap;
        overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; }
    .err.fresh { animation: fresh 6s ease-out; border-radius: 6px; }
    details.recovered { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
    details.recovered > summary { cursor: pointer; color: var(--ok); font-size: 14px; }
    details.recovered .err .msg { color: var(--muted); }
    details.recovered .err .n { font-weight: 600; }
    #newer { position: fixed; top: 112px; left: 50%; transform: translateX(-50%); z-index: 6; background: var(--accent); color: #fff;
        border: none; border-radius: 18px; padding: 6px 16px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
    #closed { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; place-items: center; z-index: 20; }
    #closed div { background: var(--card); padding: 24px 28px; border-radius: 12px; max-width: 420px; }
    #zoom { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: none; place-items: center; z-index: 10; cursor: zoom-out; }
    #zoom figure { margin: 0; text-align: center; color: #fff; }
    #zoom img { width: min(70vmin, 640px); height: min(70vmin, 640px); object-fit: contain; image-rendering: pixelated;
        background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 24px 24px; border-radius: 8px; }
</style>
</head>
<body>
<header>
    <div class="bar">
        <h1>Moderation</h1>
        <form id="search">
            <input type="search" id="query" placeholder="Wörter suchen, z. B. wort1, wort2 oder &quot;zwei Wörter&quot;" autocomplete="off">
            <button type="submit">Suchen</button>
            <button type="button" id="list">Alle Versionen</button>
            <button type="button" id="live" class="live" title="Neue Bilder und Texte zeigen, sobald ein Spiel gespeichert wird"><span class="dot"></span>Live</button>
            <button type="button" id="fullscreen" title="Die Seite im Vollbild (F11 geht auch)">⤢ Vollbild</button>
        </form>
        <span id="clock"></span>
    </div>
    <div class="bar" id="filters" style="margin-top: 8px">
        <label><input type="checkbox" id="only_new" checked> nur Neues (jedes Bild und jeder Text nur einmal: im ältesten Spiel, das ihn hat)</label>
        <label><input type="checkbox" id="only_saved"> nur gespeicherte Versionen</label>
    </div>
</header>
<main>
    <div id="status"></div>
    <div id="games"></div>
    <button id="more" hidden>Weitere zeigen</button>
    <!-- Live: the Fehlerberichte beside the new pictures and texts -->
    <aside id="errors" hidden></aside>
</main>
<button id="newer" type="button" hidden></button>
<div id="zoom"><figure><img alt=""><figcaption></figcaption></figure></div>
<div id="closed"><div><h2 style="margin-top: 0">Die Seite ist geschlossen</h2>
    <p>Die Zeit ist um oder die Moderation wurde im Terminal beendet. <code>./moderate.rb web</code> öffnet eine neue Seite mit einem neuen Link.</p></div></div>
<script>
'use strict';
const TOKEN = location.pathname.split('/')[2] || '';
const PAGE = 30;
const state = { mode: 'list', offset: 0, query: '', deleted: new Set(), expires: 0, offset_now: 0, closed: false };
// Live: the newest file time seen, the tags shown, new ones not looked at yet
const live = { since: null, shown: new Set(), timer: null, busy: false, paused: false, unseen: 0, newer: 0, checked: null,
    errors: new Map() };   // group id → count shown
const LIVE_EVERY_MS = 4000;
const LIVE_MAX_CARDS = 300;
const $ = (id) => document.getElementById(id);

// Builds an element; strings become text (never HTML).
function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
        if (value === null || value === undefined || value === false) continue;
        if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
        else if (key === 'class') node.className = value;
        else node.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children.flat()) {
        if (child === null || child === undefined || child === false) continue;
        node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
}

async function api(path, data = {}) {
    const response = await fetch(`/api/moderation/${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...data, token: TOKEN }),
    });
    if (response.status === 403) { closed(); throw new Error('closed'); }
    if (!response.ok) throw new Error(`Der Server antwortet mit ${response.status}.`);
    return response.json();
}

function closed() {
    state.closed = true;
    stop_live();
    $('closed').style.display = 'grid';
}

function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
function date(seconds) {
    return new Date(seconds * 1000).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// The same as Moderation.normalize: lower case, without accents, ß as ss.
function normalize(text) {
    return String(text).normalize('NFKD').replace(/\p{Mn}/gu, '').toLowerCase().replaceAll('ß', 'ss').replace(/\s+/g, ' ');
}

// The text with the found word marked (where it can be found as it is).
function marked(text, term) {
    const plain = String(text);
    const i = normalize(plain).indexOf(term);
    if (i < 0 || normalize(plain.slice(0, i)).length !== i) return [el('mark', {}, plain)];
    return [plain.slice(0, i), el('mark', {}, plain.slice(i, i + term.length)), plain.slice(i + term.length)];
}

function tick() {
    const left = Math.max(0, state.expires - (Date.now() / 1000 + state.offset_now));
    if (state.expires && left <= 0) closed();
    const until = new Date(state.expires * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    $('clock').textContent = state.expires ? `offen bis ${until} (noch ${Math.ceil(left / 60)} min)` : '';
}

async function status() {
    try {
        const data = await api('status');
        state.expires = data.expires_at;
        state.offset_now = data.now - Date.now() / 1000;
        tick();
    } catch (e) { /* closed() shows it */ }
}

function show_status(...parts) {
    $('status').replaceChildren(...parts);
}

// Waits while the server reads all games (the first time after opening).
async function load(path, data) {
    for (;;) {
        const result = await api(path, data);
        if (!result.loading) return result;
        const [done, total] = result.loading;
        show_status((total ? `Die Spiele werden gelesen … ${done} von ${total}` : 'Die Spiele werden gelesen …') +
            ' (beim ersten Mal dauert es, danach kennt der Zwischenspeicher sie)');
        await new Promise(resolve => setTimeout(resolve, 1000));
    }
}

function zoom(frame) {
    const box = $('zoom');
    box.querySelector('img').src = `/gen/png/${frame}.png`;
    box.querySelector('figcaption').textContent = `Bild ${frame} – Klick oder Esc schließt`;
    box.style.display = 'grid';
}
$('zoom').addEventListener('click', () => { $('zoom').style.display = 'none'; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('zoom').style.display = 'none'; });

function delete_report(report) {
    const r = report;
    return `Gelöscht: ${plural(r.tags.length, 'Version', 'Versionen')} – ${plural(r.frames, 'Bild', 'Bilder')}, ` +
        `${plural(r.sheets, 'Spritesheet', 'Spritesheets')}, ${plural(r.gifs, 'Gif', 'Gifs')}, ` +
        `${plural(r.files, 'Datei', 'Dateien')} insgesamt; ${r.in_database} aus der Datenbank` +
        (r.playtesting.length ? `; Playtesting angepasst (${r.playtesting.join(', ')})` : '') + '.';
}

function mark_deleted(tags) {
    for (const tag of tags) state.deleted.add(tag);
    for (const card of document.querySelectorAll('.card[data-tag]')) {
        if (state.deleted.has(card.dataset.tag) && !card.classList.contains('gone')) {
            card.classList.add('gone');
            card.querySelector('.actions')?.replaceChildren(el('span', { class: 'error' }, 'gelöscht'));
            card.querySelector('.confirm')?.remove();
        }
    }
}

// The question before deleting, in the card (or above a search result).
function confirm_box(where, tags, later_count, done) {
    where.querySelector('.confirm')?.remove();
    const later = el('input', { type: 'checkbox' });
    const reason = el('input', { type: 'text', placeholder: 'Grund (für das Protokoll, freiwillig)', maxlength: 200 });
    const go = el('button', { class: 'danger', type: 'button' }, 'Endgültig löschen');
    const message = el('div');
    const box = el('div', { class: 'confirm' },
        el('div', {}, tags.length === 1
            ? `Die Version ${tags[0]} wird mit allem, was nur sie braucht (Bilder, Spritesheets, Gifs, Datenbank), endgültig gelöscht.`
            : `${tags.length} Versionen werden mit allem, was nur sie brauchen, endgültig gelöscht.`),
        later_count > 0 ? el('label', {}, later, ` auch ${later_count === 1 ? 'die spätere Version' : `alle ${later_count} späteren Versionen`} (aus ${tags.length === 1 ? 'ihr' : 'ihnen'} gemacht) löschen`) : null,
        el('div', { class: 'row' }, reason, go, el('button', { type: 'button', onclick: () => box.remove() }, 'Abbrechen')),
        message);
    go.addEventListener('click', async () => {
        go.disabled = true;
        message.replaceChildren('Wird gelöscht …');
        try {
            const result = await load('delete', { tags, later: later.checked, reason: reason.value });
            if (result.error) throw new Error('Keine Version zum Löschen gefunden.');
            box.remove();
            mark_deleted(result.report.tags);
            done(result.report);
        } catch (e) {
            go.disabled = false;
            message.replaceChildren(el('span', { class: 'error' }, e.message === 'closed' ? '' : e.message));
        }
    });
    where.append(box);
    reason.focus();
}

function card(game, terms = [], { in_live = false } = {}) {
    const gone = state.deleted.has(game.tag);
    const title = game.title?.trim() ? `»${game.title}«` : '(ohne Titel)';
    const author = game.author?.trim() ? ` von ${game.author}` : '';
    const node = el('div', { class: `card${gone ? ' gone' : ''}${in_live ? ' live' : ''}`, 'data-tag': game.tag });
    const del = el('button', { class: 'danger light', type: 'button' }, 'Löschen …');
    del.addEventListener('click', () => confirm_box(node, [game.tag], game.later.filter(t => !state.deleted.has(t)).length, (report) => {
        node.append(el('div', { class: 'result' }, delete_report(report)));
    }));
    node.append(el('div', { class: 'head' },
        in_live ? el('span', { class: 'time' }, new Date(game.time * 1000).toLocaleTimeString('de-DE')) : null,
        el('span', { class: 'tag' }, game.tag),
        el('span', { class: 'name' }, title, author),
        in_live ? null : el('span', { class: 'meta' }, date(game.time)),
        game.saved === true ? el('span', { class: 'badge saved' }, 'gespeichert') : game.saved === false ? el('span', { class: 'badge' }, 'nur gespielt') : null,
        game.parent ? el('span', { class: 'meta' }, `aus ${game.parent}`) : null,
        game.later.length ? el('span', { class: 'meta' }, plural(game.later.length, 'spätere Version', 'spätere Versionen')) : null,
        el('span', { class: 'actions' },
            el('a', { href: `/play/${game.tag}`, target: '_blank', rel: 'noreferrer noopener' }, 'Spielen ↗'),
            gone ? el('span', { class: 'error' }, 'gelöscht') : del)));
    if (game.hits?.length) {
        node.append(el('ul', { class: 'hits' }, game.hits.map(hit =>
            el('li', {}, el('span', { class: 'where' }, `${hit.where}: `), marked(hit.text, hit.term)))));
    }
    const only_new = in_live || $('only_new').checked;
    // pictures from the recipes, or shown with an older game already
    const known = game.frame_count - game.frames.length;
    if (game.frames.length) {
        node.append(el('div', { class: 'frames' }, game.frames.map(frame =>
            el('button', { type: 'button', title: frame, onclick: () => zoom(frame) },
                el('img', { src: `/gen/png/${frame}.png`, alt: '', loading: 'lazy' })))));
    } else if (!in_live) {
        node.append(el('div', { class: 'none' }, only_new ? 'keine neuen Bilder' : 'keine eigenen Bilder'));
    }
    if (known > 0 && !in_live) node.append(el('div', { class: 'none' }, `${plural(known, 'weiteres Bild ist', 'weitere Bilder sind')} aus den Rezepten${only_new ? ' oder schon bei einem älteren Spiel gezeigt' : ''}.`));
    if (game.texts.length) {
        node.append(el('div', { class: 'texts', title: only_new ? 'neue Texte' : 'alle Texte' },
            game.texts.map(text => el('span', {}, terms.length ? marked_any(text, terms) : text))));
    } else if (only_new && !in_live) {
        node.append(el('div', { class: 'none' }, 'keine neuen Texte'));
    }
    return node;
}

function marked_any(text, terms) {
    const term = terms.find(t => normalize(text).includes(t));
    return term ? marked(text, term) : text;
}

async function show_list(more = false) {
    stop_live();
    state.mode = 'list';
    if (!more) {
        state.offset = 0;
        $('games').replaceChildren();
    }
    $('more').hidden = true;
    try {
        const data = await load('games', { offset: state.offset, limit: PAGE, only_new: $('only_new').checked, only_saved: $('only_saved').checked });
        state.offset += data.games.length;
        show_status(`${data.total} von ${data.all} Versionen, die neuesten zuerst` +
            ($('only_new').checked ? ' (Versionen ohne neue Bilder oder Texte sind ausgelassen)' : '') +
            '. Bilder und Texte aus den Rezepten werden nie gezeigt.');
        $('games').append(...data.games.map(game => card(game)));
        $('more').hidden = state.offset >= data.total;
    } catch (e) {
        if (e.message !== 'closed') show_status(el('span', { class: 'error' }, e.message));
    }
}

async function search(query) {
    stop_live();
    state.mode = 'search';
    state.query = query;
    $('games').replaceChildren();
    $('more').hidden = true;
    show_status('Wird gesucht …');
    try {
        const data = await load('search', { query, only_new: $('only_new').checked });
        if (!data.terms.length) return show_list();
        const words = data.terms.map(t => `»${t}«`).join(' oder ');
        if (!data.total) {
            show_status(`Kein Spiel enthält ${words} (${data.all} Spiele durchsucht).`);
            return;
        }
        // the ones not deleted yet, when it is clicked
        const left = () => data.games.map(g => g.tag).filter(t => !state.deleted.has(t));
        const tags = left();
        const all = el('button', { class: 'danger light', type: 'button' }, `Alle ${tags.length} löschen …`);
        const box = el('div', { style: 'flex-basis: 100%' });
        all.addEventListener('click', () => {
            const now = left();
            if (!now.length) return;
            const later = new Set(data.games.filter(g => now.includes(g.tag)).flatMap(g => g.later)
                .filter(t => !now.includes(t) && !state.deleted.has(t))).size;
            confirm_box(box, now, later, (report) => {
                box.append(el('div', { class: 'result' }, delete_report(report)));
                all.remove();
            });
        });
        show_status(`${plural(data.total, 'Spiel enthält', 'Spiele enthalten')} ${words}` +
            (data.total > data.games.length ? ` (die neuesten ${data.games.length} sind gezeigt)` : '') + '.',
            tags.length ? all : null, box);
        $('games').append(...data.games.map(game => card(game, data.terms)));
    } catch (e) {
        if (e.message !== 'closed') show_status(el('span', { class: 'error' }, e.message));
    }
}

// ------------------------------------------------------------ Live
// Every few seconds: the versions saved since the newest one shown that bring
// a picture or a text for the first time (moderation.rb page_stream), on top.
function stop_live() {
    clearTimeout(live.timer);
    live.timer = null;
    $('live').classList.remove('on');
    $('filters').hidden = false;
    $('errors').hidden = true;
    document.querySelector('main').classList.remove('dashboard');
    document.body.classList.remove('dashboard');
    document.documentElement.style.overflowAnchor = '';
    $('newer').hidden = true;
    live.newer = 0;
}

function show_live() {
    stop_live();
    state.mode = 'live';
    live.since = null;
    live.shown = new Set();
    live.paused = false;
    live.unseen = 0;
    live.errors = new Map();
    live.errors_seen = false;
    $('games').replaceChildren();
    $('more').hidden = true;
    $('filters').hidden = true;
    document.querySelector('main').classList.add('dashboard');
    document.body.classList.add('dashboard');
    // add_live keeps the place itself (the same in every browser; Chrome's
    // own scroll anchoring would move it a second time)
    document.documentElement.style.overflowAnchor = 'none';
    $('errors').hidden = false;
    $('errors').replaceChildren(el('h2', {}, 'Fehler'), el('div', { class: 'hint' }, 'Die Fehlerberichte werden gelesen …'));
    $('live').classList.add('on');
    live_status('Die neuesten Spiele werden gelesen …');
    poll_live();
}

function live_status(text) {
    const dot = el('span', { class: `dot ${live.paused ? 'paused' : 'on'}` });
    const pause = el('button', { type: 'button', onclick: () => {
        live.paused = !live.paused;
        if (!live.paused) poll_live(); else { clearTimeout(live.timer); live_status(); }
    } }, live.paused ? 'Weiter' : 'Anhalten');
    const checked = live.checked ? `zuletzt nachgesehen ${live.checked.toLocaleTimeString('de-DE')}` : '';
    show_status(dot, text ?? (live.paused ? 'Angehalten – nichts Neues kommt dazu.' :
        `Live: neue Bilder und Texte, sobald ein Spiel gespeichert wird (jedes nur einmal, nichts aus den Rezepten). ${checked}`), pause);
}

async function poll_live() {
    if (state.mode !== 'live' || live.paused || live.busy || state.closed) return;
    live.busy = true;
    poll_errors();
    try {
        const data = await load('stream', { since: live.since, limit: live.since === null ? 30 : 100 });
        if (state.mode !== 'live') return;
        const fresh = data.games.filter(g => !live.shown.has(g.tag));
        for (const g of data.games) live.since = Math.max(live.since ?? 0, g.time);
        if (live.since === null) live.since = data.now;
        add_live(fresh, live.checked !== null);
        live.checked = new Date();
        if (!$('games').children.length) live_status('Live: noch nichts Neues – sobald ein Spiel mit neuen Bildern oder Texten gespeichert wird, steht es hier.');
        else live_status();
    } catch (e) {
        if (e.message !== 'closed') live_status(`Live: ${e.message} Es wird gleich noch einmal versucht.`);
    } finally {
        live.busy = false;
        if (state.mode === 'live' && !live.paused && !state.closed) live.timer = setTimeout(poll_live, LIVE_EVERY_MS);
    }
}

// newest first, on top; the page does not jump while one looks further down
function add_live(games, highlight) {
    if (!games.length) return;
    const list = $('games');
    const before = list.offsetHeight;
    const nodes = games.map(game => {
        live.shown.add(game.tag);
        return card(game, [], { in_live: true });
    });
    if (highlight) nodes.forEach(n => n.classList.add('fresh'));
    list.prepend(...nodes);
    while (list.children.length > LIVE_MAX_CARDS) list.lastElementChild.remove();
    if (!highlight) return;
    if (window.scrollY > 80) {
        window.scrollBy(0, list.offsetHeight - before);
        live.newer += games.length;
        $('newer').textContent = `↑ ${plural(live.newer, 'neues Spiel', 'neue Spiele')}`;
        $('newer').hidden = false;
    }
    count_unseen(games.length);
}

function count_unseen(n) {
    if (!document.hidden || !n) return;
    live.unseen += n;
    document.title = `(${live.unseen}) Moderation – 2D Game Studio`;
}

// ---------------------------------------------------------------- Fehler
// Today's open Fehlerberichte, the latest first (client_errors.rb dashboard):
// each with the text of ./errors.rb show, to copy and paste.
async function copy_text(text, button) {
    const label = button.textContent;
    try {
        await navigator.clipboard.writeText(text);
    } catch (e) {
        const area = el('textarea', { style: 'position: fixed; opacity: 0' });
        area.value = text;
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
    }
    button.textContent = 'Kopiert ✓';
    setTimeout(() => { button.textContent = label; }, 1500);
}

function error_item(group, fresh) {
    const where = { sprites: 'Sprites', level: 'Level', play: 'Spielen', settings: 'Einstellungen', help: 'Hilfe' }[group.pane] ?? group.pane;
    const details = el('pre', { hidden: true }, group.text);
    const show = el('button', { type: 'button', class: 'details-toggle', onclick: () => {
        details.hidden = !details.hidden;
        show.textContent = details.hidden ? 'Einzelheiten' : 'Zuklappen';
    } }, 'Einzelheiten');
    const copy = el('button', { type: 'button', onclick: () => copy_text(group.text, copy) }, 'Kopieren');
    // repariert: like ./errors.rb resolve – back only when it happens again
    const done = el('button', { type: 'button', class: 'done',
        title: 'Repariert? Dann verschwindet die Gruppe – und kommt nur wieder, wenn der Fehler noch einmal passiert (wie ./errors.rb resolve).',
        onclick: () => resolve_error(group.id, done) }, 'Erledigt ✓');
    const time = new Date(group.last).toLocaleTimeString('de-DE');
    return el('div', { class: `err${fresh ? ' fresh' : ''}`, 'data-id': group.id },
        el('div', { class: 'top' },
            el('span', { class: 'id' }, group.id),
            el('span', { class: 'n' }, `${group.count}×`),
            el('span', { class: 'meta' }, `zuletzt ${time}`),
            group.again ? el('span', { class: 'badge again' }, 'wieder aufgetreten') : null),
        el('div', { class: 'msg' }, group.message),
        el('div', { class: 'meta' }, [where, group.in_game ? 'im Spiel' : null, group.in_session ? 'in einer Sitzung' : null,
            group.related.length ? `zusammen mit ${group.related.join(', ')}` : null].filter(Boolean).join(' · ')),
        el('div', { class: 'row' }, copy, show, done),
        details);
}

async function resolve_error(id, button) {
    button.disabled = true;
    try {
        const data = await api('resolve', { id });
        if (data.error) throw new Error('Diese Gruppe ist nicht mehr offen.');
        // what is gone now must not count as new once it comes back
        live.errors.delete(id);
        show_errors(data);
    } catch (e) {
        button.disabled = false;
        if (e.message !== 'closed') button.textContent = 'Nicht geklappt';
    }
}

async function poll_errors() {
    let data;
    try { data = await api('errors'); } catch (e) { return; }
    show_errors(data);
}

function show_errors(data) {
    if (state.mode !== 'live') return;
    // the first answer is what was there already: nothing is marked new
    const first = !live.errors_seen;
    live.errors_seen = true;
    let changed = 0;
    const item = (group) => {
        const before = live.errors.get(group.id);
        const fresh = !first && before !== group.count;
        // what the studio got over by itself is no reason to look up
        if (fresh && !group.recovered) changed += 1;
        return error_item(group, fresh);
    };
    // crashes: what a child noticed; recovered: the studio helped itself
    // (the graphics came back …) – apart, quieter (client_errors.rb recovered?)
    const crashes = data.groups.filter(g => !g.recovered);
    const recovered = data.groups.filter(g => g.recovered);
    const crash_items = crashes.map(item);
    const recovered_items = recovered.map(item);
    live.errors = new Map(data.groups.map(g => [g.id, g.count]));
    const all = crashes.map(g => g.text).join('\n\n');
    const copy_all = el('button', { type: 'button', onclick: () => copy_text(all, copy_all) }, 'Alle kopieren');
    const reports = crashes.reduce((n, g) => n + g.count, 0);
    const recovered_reports = recovered.reduce((n, g) => n + g.count, 0);
    const box = $('errors');
    // an open "Einzelheiten" and the open list of recovered ones stay open
    const open = new Set([...box.querySelectorAll('.err')].filter(e => !e.querySelector('pre').hidden).map(e => e.dataset.id));
    const recovered_open = box.querySelector('details.recovered')?.open ?? false;
    box.replaceChildren(
        el('h2', {}, 'Fehler heute', el('span', { class: 'count' }, crashes.length ? `${crashes.length}` : ''),
            el('span', { class: 'tools' }, crashes.length ? copy_all : null)),
        el('div', { class: 'hint' }, crashes.length
            ? `${plural(reports, 'Bericht', 'Berichte')} in ${plural(crashes.length, 'Gruppe', 'Gruppen')}, offen. Kopieren gibt den Text von ./errors.rb show; Erledigt blendet eine reparierte Gruppe aus, bis sie wieder auftritt.`
            : 'Keine offenen Fehler heute. Kommt einer, steht er hier.'),
        ...crash_items,
        recovered.length ? el('details', { class: 'recovered', open: recovered_open },
            el('summary', {}, `Von selbst erholt: ${plural(recovered_reports, 'Mal', 'Mal')} in ${plural(recovered.length, 'Gruppe', 'Gruppen')}`),
            el('div', { class: 'hint' }, 'Das Studio hat sich selbst geholfen (z. B. die Grafik kam zurück) – niemand musste neu laden. Häufen sie sich, lohnt ein Blick.'),
            ...recovered_items) : null);
    for (const node of box.querySelectorAll('.err')) {
        if (!open.has(node.dataset.id)) continue;
        node.querySelector('pre').hidden = false;
        node.querySelector('.details-toggle').textContent = 'Zuklappen';
    }
    count_unseen(changed);
}

// ---------------------------------------------------------------- Vollbild
// the dashboard on a screen of its own (F11 does the same)
function toggle_fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => null);
}
function show_fullscreen_state() {
    $('fullscreen').textContent = document.fullscreenElement ? '⤡ Vollbild beenden' : '⤢ Vollbild';
}
$('fullscreen').addEventListener('click', toggle_fullscreen);
document.addEventListener('fullscreenchange', show_fullscreen_state);
if (!document.fullscreenEnabled) $('fullscreen').hidden = true;

$('live').addEventListener('click', () => show_live());
$('newer').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });
window.addEventListener('scroll', () => {
    if (window.scrollY <= 80 && !$('newer').hidden) { $('newer').hidden = true; live.newer = 0; }
});
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { live.unseen = 0; document.title = 'Moderation – 2D Game Studio'; }
});

$('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const query = $('query').value.trim();
    if (query) search(query); else show_list();
});
$('list').addEventListener('click', () => { $('query').value = ''; show_list(); });
$('more').addEventListener('click', () => show_list(true));
for (const id of ['only_new', 'only_saved']) $(id).addEventListener('change', () => { if (state.mode === 'list') show_list(); else if (state.mode === 'search') search(state.query); });

status();
setInterval(status, 30000);
setInterval(tick, 5000);
// opens with what is new, as it comes (Alle Versionen and the search as before)
show_live();
</script>
</body>
</html>
