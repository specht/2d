<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8" />
    <title>2D Game Engine</title>
    <link href="fonts.css?#{@@cache_buster}" rel="stylesheet">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        /* cursor: none; */
        font-size: 12px;
        user-select: none;
      }

      canvas {
        width: 100%;
        height: 100%
      }
      .play_container {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: #000;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .play_container_inner {
          background-color: #000;
          aspect-ratio: 16/9;
          overflow: hidden;
          /* height: 100%; */
          /* max-width: 100%; */
      }

      .poster {
        font-family: 'Carter One', cursive;
        color: #fff;
        font-size: 400%;
        text-align: center;
        padding: 1em 1em 0.2em 1em;
        line-height: 1.2em;
      }

      .menu {
        color: #ddd;
        text-align: center;
        font-size: 200%;
        font-family: 'Bebas Neue', cursive;
        text-align: center;
      }

      .menu .item {
        width: 10em;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 0 0.2em 0 rgba(255, 255, 255, 0.3);
        margin-bottom: 0.5em;
        cursor: pointer;
        /* border-radius: 0.3em; */
        transition: background-color 0.2s ease-out, box-shadow 0.2s ease-out;
      }

      .menu .item:hover {
        box-shadow: 0 0 0.2em 0.1em rgba(255, 255, 255, 0.3);
        background-color: rgba(255, 255, 255, 0.1);
        transition: none;
      }

      #overlay {
        /* the start screen scales with the game (17px at 1280 × 720) */
        font-size: min(2.4vh, 1.35vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #overlay .poster {
        padding: 0 1em 0.3em 1em;
      }
      /* title and author in the game's pixel font (screens.js render_curtain) */
      #game_title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.6vh;
      }
      #game_title canvas {
        display: block;
        image-rendering: pixelated;
        max-width: 92vw;
        object-fit: contain;
      }
      #overlay .menu .item {
        margin-top: 1.2em;
      }
      #start_controls {
        margin-top: 1.2em;
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.35em 1.2em;
        align-items: center;
        color: #ccc;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 120%;
      }
      #start_controls .label {
        text-align: right;
        color: #999;
      }
      #start_controls .keys {
        display: flex;
        gap: 0.3em;
        flex-wrap: wrap;
      }
      #start_controls .key {
        display: inline-block;
        min-width: 1.4em;
        padding: 0.05em 0.45em;
        border: 1px solid #777;
        border-bottom-width: 3px;
        border-radius: 0.3em;
        color: #fff;
        text-align: center;
      }
      #start_controls .keys {
        align-items: center;
      }
      #start_controls .oder {
        color: #777;
        font-size: 80%;
        margin: 0 0.2em 0 0.5em;
      }
      #start_controls .key.alt {
        color: #aaa;
        border-color: #555;
        font-size: 80%;
      }
      #start_hint {
        margin-top: 1.4em;
        color: #888;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 100%;
        text-align: center;
      }
      #screen, #overlay, #curtain, #curtain_text {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
      }
      #curtain {
        background-color: rgba(0, 0, 0, 0.5);
        opacity: 0.0;
        transition: opacity 0.5s ease;
      }
      #curtain.showing {
        opacity: 1.0;
      }
      #curtain_text {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Bebas Neue', sans-serif;
        font-size: 8vh;
        text-shadow: 0.4vh 0.4vh #000;
        color: #fff;
        opacity: 0;
        transform: scale(0.0);
        transition: transform 0.5s ease, opacity 0.5s ease;
      }
      #curtain_text.showing {
        opacity: 1;
        transform: scale(1.0);
      }
      /* the lines of a screen (screens.js): pixel bitmaps in the game's font */
      #curtain_text {
        gap: 2.2vh;
      }
      #curtain_text canvas.curtain-line {
        display: block;
        image-rendering: pixelated;
        max-width: 96%;
        object-fit: contain;
      }
      #curtain_text canvas.curtain-pulse {
        animation: curtain-pulse 1.6s ease-in-out infinite;
      }
      @keyframes curtain-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        #curtain_text canvas.curtain-pulse { animation: none; }
      }
      /* a test run from the studio's level editor (app.js start_playtest) */
      #playtest_badge {
        position: absolute;
        right: 1.5vh;
        bottom: 1.5vh;
        padding: 0.6vh 1.4vh;
        border-radius: 0.8vh;
        background: rgba(26, 28, 44, 0.85);
        border: 1px solid rgba(255, 205, 117, 0.7);
        color: #f4f4f4;
        font-family: sans-serif;
        font-size: 1.9vh;
        pointer-events: none;
        display: none;
        z-index: 5;
      }
      #playtest_badge.showing {
        display: block;
      }
      #playtest_badge b {
        color: #ffcd75;
      }
      #console {
        position: absolute;
        font-family: 'IBM Plex Mono', 'Roboto Mono', monospace;
        pointer-events: none;
        left: 0;
        right: 0;
        bottom: 0;
        text-align: center;
        transition: transform 0.5s ease;
        transform: translate(0, 8vh);
      }
      #console.showing {
        transform: translate(0, 0);
      }
      .console-message {
        font-size: 4vh;
        color: #fff;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 1vh;
      }
      #touch_controls {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        /* taps between the buttons reach the game (F boxes, aiming) */
        pointer-events: none;
      }
      #touch_controls > * {
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
    <script>window.CACHE_BUSTER = '#{@@cache_buster}';</script>
    <script src="three.min.js?#{@@cache_buster}"></script>
    <script src="jquery-3.6.0.min.js"></script>
    <script src="misc.js?#{@@cache_buster}"></script>
    <script src="api.js?#{@@cache_buster}"></script>
    <script src="interval_tree.js?#{@@cache_buster}"></script>
    <script src="avl.js?#{@@cache_buster}"></script>
    <script src="shaders.js?#{@@cache_buster}"></script>
    <script src="backdrops.js?#{@@cache_buster}"></script>
    <script src="signals.js?#{@@cache_buster}"></script>
    <script src="platforms.js?#{@@cache_buster}"></script>
    <script src="level_flow.js?#{@@cache_buster}"></script>
    <script src="speech.js?#{@@cache_buster}"></script>
    <script src="hud.js?#{@@cache_buster}"></script>
    <script src="screens.js?#{@@cache_buster}"></script>
    <script src="traits.js?#{@@cache_buster}"></script>
    <script src="controls.js?#{@@cache_buster}"></script>
    <script src="baddie_ai.js?#{@@cache_buster}"></script>
    <script src="fullscreen.js?#{@@cache_buster}"></script>
    <script src="combat_melee_trait.js?#{@@cache_buster}"></script>
    <script src="combat.js?#{@@cache_buster}"></script>
    <script src="combat_swing.js?#{@@cache_buster}"></script>
    <script src="combat_projectile.js?#{@@cache_buster}"></script>
    <script src="layer_fade.js?#{@@cache_buster}"></script>
    <script src="movement_regions.js?#{@@cache_buster}"></script>
    <script src="companion_ai.js?#{@@cache_buster}"></script>
    <script src="game_ids.js?#{@@cache_buster}"></script>
    <script src="app.js?#{@@cache_buster}"></script>
    <!-- the YouTube player is loaded by app.js, only for games with music -->
  </head>
  <body>
    <div id='yt_placeholder' style="display: none;"></div>
    <div class="play_container">
      <div class="play_container_inner">
        <div id="screen"></div>
        <div id="curtain">
        </div>
        <div id="curtain_text">
        </div>
        <div id="touch_controls" style="display: none;">
        </div>
        <div id="overlay">
          <div class="poster">
            <div id='game_title'></div>
            <div id='game_author' style="font-size: 60%;"></div>
          </div>
          <div class="menu">
            <div class='item' id="mi_start">Start</div>
          </div>
          <!-- the game's own controls (filled in by app.js: render_start_screen) -->
          <div id="start_controls"></div>
          <div id="start_hint"></div>
        </div>
        <div id="playtest_badge"><b>Test</b> · R: neu starten · Esc: zurück zum Level</div>
        <div id="console">
        </div>
      </div>
    </div>
  </body>

</html>
