# Pip und das letzte Licht – ein Demospiel aus dem Sprite-Katalog.
# Bauen: cd rezepte/tools && npm run demo   (README.md, "Das Demospiel")
# Die Karten sind Rezept-Szenen (rezepte/README.md): eine Zeile pro Kachelreihe,
# ein Zeichen pro Kachel, die Legende sagt, welches Sprite.
#
# Die Geschichte: Der Leuchtturm über Funkelbach ist dunkel, die Fischer finden
# nicht nach Hause. Pip holt den Zauberschlüssel der Wärterin aus der Burg und
# zündet das Licht wieder an.
#
#   dorf    Abend im Dorf: Parallaxe, Fensterlicht, Glühwürmchen, ein Wichtel spricht
#           (Signalbereich), Begleiter Bello, Hügel, Laden-Tür (F), Checkpoint,
#           Hebel öffnet das Dorftor
#   laden   Nebenlevel: Sigis Laden – Bogen, Feder, Heiltrank (öfter kaufen), zurück
#   hoehle  Höhlendunkel und Leuchtpilze, Schwert im Lichtschacht, Bröckelbrücke über
#           Stacheln, drei Hebel + Zähler öffnen ein Tor, Plattform über Lava, Aufzug
#   burg    Gewitter und Regen, ein Wächter öffnet beim Besiegen das Tor, Druckplatte
#           mit Tor auf Zeit, Stampfer, Leitern, Spuckpilz, Schlüssel + Schlosstür,
#           Förderband, der Zauberschlüssel (bleibt fürs ganze Spiel)
#   meer    Schwimmen und Tauchen, Quallen, ein Hai jagt, Strömung im Riffkanal
#   turm    Nordlicht, das Tor öffnet nur der Zauberschlüssel („sendet, wenn die
#           Spielfigur … hat“), Hebel: das Leuchtfeuer erscheint, das Boot fährt
#           heim, der Wichtel spricht, ein Zähler beendet das Spiel
