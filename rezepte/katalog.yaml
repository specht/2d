    label: Katze (unverwundbar)
    traits:
      baddie:
        energy: 40
        damage: 20
        vrun: 0.5
        patrols: false
        start_dir: left
        wait_until_seen: false
        ex_left: 0.75
        ex_right: 0.75
        ex_top: 0.6
        invincible: true
        behavior: { type: still }
    states:
      - { strip: katze/stehen, fps: 3, traits: { baddie: [right] } }
      - { strip: katze/laufen, fps: 10, traits: { baddie: [walk_right] } }
  # Begleiter (companion_ai.js): characters that follow Pip with their own way
  # of moving. Only the settings that differ from a new Begleiter are given.
  # Fully animated, so children can take them into their own games
  # ("Sprites holen" → Sprite-Katalog), with pictures for keeping busy while the
  # player stands still ("sitzt", "beschäftigt sich").
  hund:
    label: Hund
    traits:
      companion: {}
    states:
      - { strip: hund/stehen, fps: 3, traits: { companion: [right] } }
      - { strip: hund/laufen, fps: 10, traits: { companion: [walk_right] } }
      - { strip: hund/springen, traits: { companion: [jump_right] } }
      - { strip: hund/fallen, traits: { companion: [fall_right] } }
      - { strip: hund/sitzt, fps: 3, traits: { companion: [sit_right] } }
      - { strip: hund/schnueffelt, fps: 6, traits: { companion: [busy_right] } }
  kaetzchen:
    label: Kätzchen
    traits:
      # quick and a high jumper
      companion: { vrun: 3.2, vjump: 7.5 }
    states:
      - { strip: kaetzchen/stehen, fps: 4, traits: { companion: [right] } }
      - { strip: kaetzchen/laufen, fps: 10, traits: { companion: [walk_right] } }
      - { strip: kaetzchen/springen, traits: { companion: [jump_right] } }
