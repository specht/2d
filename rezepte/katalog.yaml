# The Sprite-Katalog of the studio (Sprites aus einem anderen Spiel holen →
# Sprite-Katalog, sprite_basket.js): every sprite above in one group, in this
# order. The build writes it as katalog.json (with every frame) and stops when a
# sprite is in no group and not in nicht_in_sammlung.
sammlung:
  - Spielfiguren: [pip, pip_einfach, pip_schwert, pip_bogen, pip_bogen_schraeg, pip_wurf, pip_bombe, pip_taucher, astronaut, fisch, u_boot]
