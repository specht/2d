# Animation catalogue for the recipe (Rezepte) GIFs.
#
# Every animation is a PNG strip in sprites/<folder>/<name>.png: frames are
# 24x24 pixels, laid out left to right. Edit the PNGs with any pixel editor;
# add or remove frames by making the strip wider or narrower.
#
# `sprites` below turns those strips into real game sprites, exactly as a
# child would build them in the editor: a list of states, each with frames,
# fps and the state traits the engine looks for (see STATE_TRAITS in
# src/static/traits.js). The order of states matters: state 0 is the
# fallback image the engine shows when a state is missing.
#
# `extends` copies another sprite and then adds/replaces states (matched by
# `strip`) and deep-merges `traits`. `frames: [0]` picks single frames.
# Attack definitions may reference other catalogue sprites with
# `sprite: <id>`; the build replaces this with the sprite index.
#
# Adding a new situation later (e.g. swimming or gliding) means: draw a new
# strip, add a state here with the new state trait, and write a recipe.

tile: 24

sprites:
  # ---------------------------------------------------------------- Pip
  pip_einfach:
    label: Pip (ein Bild)
    traits:
      actor: { ex_left: 0.5, ex_right: 0.5, ex_top: 0.8, vjump: 7 }
    states:
      - { strip: pip/stehen, frames: [0], traits: { actor: [right] } }

  pip:
    label: Pip
    traits:
      actor: { ex_left: 0.5, ex_right: 0.5, ex_top: 0.8, vjump: 7 }
    states:
      - { strip: pip/stehen, fps: 3, traits: { actor: [right] } }
      - { strip: pip/laufen, fps: 10, traits: { actor: [walk_right] } }
      - { strip: pip/springen, traits: { actor: [jump_right] } }
      - { strip: pip/fallen, traits: { actor: [fall_right] } }
      # on a ladder: "Spielfigur klettert" (without it the game would show
      # "Spielfigur schaut nach hinten")
      - { strip: pip/klettern, fps: 6, traits: { actor: [climb] } }
      - { strip: pip/treffer, traits: { actor: [hit_right] } }
      - { strip: pip/tot, fps: 8, traits: { actor: [dead] } }

  # Pip who gets a fright: the Treffer picture stays a little longer
  pip_erschrickt:
    label: Pip (erschrickt)
    extends: pip
    states:
      - { strip: pip/treffer, fps: 2.5, traits: { actor: [hit_right] } }

  pip_schwert:
    label: Pip mit Schwert
    extends: pip
    states:
      - { strip: pip/angriff_schwert, fps: 14, traits: { actor: [attack_right] } }
    traits:
      melee_attack:
        attack:
          id: melee
          slot: nah
          label: Schwert
          delivery: { kind: swing, range_px: 24 }
          effect: { kind: damage, amount: 20 }
          timing: { cooldown_s: 0.45 }
          visual: { kind: swoosh, sweep: down, hit_sprite_index: { sprite: treffer_funke } }

  pip_bogen:
    label: Pip mit Bogen
    extends: pip
    states:
      - { strip: pip/angriff_bogen, fps: 8, traits: { actor: [attack_right] } }
    traits:
      ranged_attack:
        attack:
          id: ranged
          slot: fern
          label: Pfeil
          delivery: { kind: projectile, range_px: 220, speed_px_s: 260 }
          effect: { kind: damage, amount: 15 }
          timing: { cooldown_s: 0.6 }
          visual: { projectile_sprite_index: { sprite: pfeil }, hit_sprite_index: { sprite: treffer_funke } }

  # the same bow, but shot at 45° with gravity: the arrow flies an arc
  pip_bogen_schraeg:
    label: Pip mit Bogen (im Bogen schießen)
    extends: pip_bogen
    traits:
      ranged_attack:
        attack:
          delivery: { range_px: 260, speed_px_s: 240, gravity_px_s2: 380, aim_angle_deg: 45 }

  pip_wurf:
    label: Pip wirft Steine
    extends: pip
    states:
      - { strip: pip/angriff_wurf, fps: 10, traits: { actor: [attack_right] } }
    traits:
      ranged_attack:
        attack:
          id: ranged
          slot: fern
          label: Stein
          delivery: { kind: projectile, range_px: 400, speed_px_s: 240, gravity_px_s2: 220 }
          effect: { kind: damage, amount: 40 }
          timing: { cooldown_s: 0.8 }
          visual: { projectile_sprite_index: { sprite: stein }, hit_sprite_index: { sprite: treffer_funke } }

  pip_bombe:
    label: Pip legt Bomben
    extends: pip
    states:
      - { strip: pip/angriff_wurf, frames: [1], fps: 8, traits: { actor: [attack_right] } }
    traits:
      ranged_attack:
        attack:
          id: ranged
          slot: fern
          label: Bombe
          delivery:
            kind: projectile
            range_px: 280
            speed_px_s: 0
            gravity_px_s2: 500
            detonation: { fuse_s: 1.6, radius_px: 40, shake_strength: 12, self_damage: false }
          effect: { kind: damage, amount: 100 }
          timing: { cooldown_s: 1.0 }
          visual: { projectile_sprite_index: { sprite: bombe } }

  # ------------------------------------------------------------- Gegner
  glibber:
    label: Glibber
    traits:
      baddie:
        energy: 40
        damage: 0
        vrun: 0.4
        patrols: true
        start_dir: left
        wait_until_seen: false
        ex_left: 0.7
        ex_right: 0.7
        ex_top: 0.45
    states:
      - { strip: glibber/laufen, fps: 6, traits: { baddie: [right, walk_right] } }
      - { strip: glibber/treffer, traits: { baddie: [hit_right] } }
      - { strip: glibber/tot, fps: 8, traits: { baddie: [dead] } }

  spuckpilz:
    label: Spuckpilz
    traits:
      baddie:
        energy: 60
        damage: 0
        vrun: 0
        patrols: false
        start_dir: left
        wait_until_seen: false
        ex_left: 0.4
        ex_right: 0.4
        ex_top: 0.8
      ranged_attack:
        attack:
          id: ranged
          slot: fern
          label: Spore
          delivery: { kind: projectile, range_px: 190, speed_px_s: 110 }
          effect: { kind: damage, amount: 10 }
          timing: { cooldown_s: 1.4 }
          visual: { projectile_sprite_index: { sprite: spore } }
    states:
      - { strip: spuckpilz/stehen, fps: 2, traits: { baddie: [right, walk_right] } }
      - { strip: spuckpilz/angriff, fps: 10, traits: { baddie: [attack_right] } }
      - { strip: spuckpilz/treffer, traits: { baddie: [hit_right] } }
      - { strip: spuckpilz/tot, fps: 8, traits: { baddie: [dead] } }

  # --------------------------------------------------------------- Welt
  boden:
    label: Boden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/boden }]
  boden_tot:
    label: Toter Boden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/boden_tot }]
  erde:
    label: Erde
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/erde }]
  boden_schnee:
    label: Boden mit Schnee
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/boden_schnee }]
  leiter:
    label: Leiter
    traits: { ladder: { center: true } }
    states: [{ strip: welt/leiter }]
  schraege:
    label: Schräge
    traits: { slope: { direction: positive } }
    states: [{ strip: welt/schraege }]
  treppe:
    label: Treppe
    traits: { slope: { direction: positive } }
    states: [{ strip: welt/treppe }]
  tuer:
    label: Tür
    traits: { door: { lockable: false, automatic: false, closable: false } }
    states:
      - { strip: welt/tuer_zu, traits: { door: [closed] } }
      - { strip: welt/tuer_auf, traits: { door: [open] } }
      - { strip: welt/tuer_uebergang, fps: 10, traits: { door: [transition] } }
  schlosstuer:
    label: Schlosstür
    traits: { door: { lockable: true, automatic: true, closable: false } }
    states:
      - { strip: welt/schlosstuer_zu, traits: { door: [closed] } }
      - { strip: welt/tuer_auf, traits: { door: [open] } }
      - { strip: welt/tuer_uebergang, fps: 10, traits: { door: [transition] } }
  schluessel:
    label: Schlüssel
    traits: { key: {} }
    states: [{ strip: welt/schluessel, fps: 3 }]
  # Signale (src/static/signals.js): a Schalter and a Druckplatte send their
  # Code; a Gittertor is locked and automatic, so only a signal opens it.
  schalter:
    label: Schalter
    traits: { switch: {} }
    states:
      - { strip: welt/schalter_aus, traits: { switch: [off] } }
      - { strip: welt/schalter_an, traits: { switch: [on] } }
  druckplatte:
    label: Druckplatte
    traits: { pressure_plate: {} }
    states:
      - { strip: welt/druckplatte_oben, traits: { pressure_plate: [up] } }
      - { strip: welt/druckplatte_unten, traits: { pressure_plate: [down] } }
  gittertor:
    label: Gittertor
    traits: { door: { lockable: true, automatic: true, closable: false } }
    states:
      - { strip: welt/gitter_zu, traits: { door: [closed] } }
      - { strip: welt/gitter_auf, traits: { door: [open] } }
      - { strip: welt/gitter_uebergang, fps: 10, traits: { door: [transition] } }
  muenze:
    label: Münze
    traits: { pickup: { points: 10 } }
    states: [{ strip: welt/muenze, fps: 8 }]

  haustuer:
    label: Haustür
    traits: { door: { lockable: false, automatic: true, closable: false } }
    states:
      - { strip: welt/tuer_zu, traits: { door: [closed] } }
      - { strip: welt/tuer_auf, traits: { door: [open] } }
      - { strip: welt/tuer_uebergang, fps: 10, traits: { door: [transition] } }
  mauer:
    label: Mauer
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/mauer }]
  dach:
    label: Dach
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/dach }]
  brett:
    label: Brett
    # Only "von oben": you can jump through from below and stand on top.
    traits: { block_above: {} }
    states: [{ strip: welt/brett }]
  eis:
    label: Eis
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/eis }]
  eishang:
    label: Eishang
    traits: { slope: { direction: negative, slippery: 150 } }
    states: [{ strip: welt/eishang }]
  broeckel:
    label: Bröckelstein
    traits:
      block_above: {}
      block_sides: {}
      block_below: {}
      falls_down: { timeout: 0.5 }
    states:
      - { strip: welt/broeckel }
      - { strip: welt/broeckel_zerfall, traits: { falls_down: [crumbling] } }
  stacheln:
    label: Stacheln
    traits: { trap: { damage: 25, damage_cool_down: 1.0 } }
    states: [{ strip: welt/stacheln }]
  fahne:
    label: Fahne
    traits: { checkpoint: {} }
    states:
      - { strip: welt/fahne_aus }
      - { strip: welt/fahne_an, fps: 4, traits: { checkpoint: [active] } }
  wurzeln:
    label: Inselboden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/wurzeln }]

  # ------------------------------ Deko (keine Eigenschaften, eigene Ebene)
  innenwand: { label: Tapete, states: [{ strip: welt/innenwand }] }
  zimmer: { label: Dunkles Zimmer, states: [{ strip: welt/zimmer }] }
  bild: { label: Bild, states: [{ strip: welt/bild }] }
  lampe: { label: Lampe, states: [{ strip: welt/lampe }] }
  fassade: { label: Fassade, states: [{ strip: welt/fassade }] }
  fassade_fenster: { label: Fassade mit Fenster, states: [{ strip: welt/fassade_fenster }] }
  moos: { label: Moos, states: [{ strip: welt/moos }] }
  ranke: { label: Ranke, states: [{ strip: welt/ranke, fps: 2 }] }
  fackel: { label: Fackel, states: [{ strip: welt/fackel, fps: 8 }] }
  riss: { label: Riss, states: [{ strip: welt/riss }] }
  grasbuesche: { label: Grasbüschel, states: [{ strip: welt/grasbuesche }] }
  pfosten: { label: Pfosten, states: [{ strip: welt/pfosten }] }
  kette: { label: Kette, states: [{ strip: welt/kette }] }
  burgfenster: { label: Burgfenster, states: [{ strip: welt/burgfenster }] }
  pfeiler: { label: Pfeiler, states: [{ strip: welt/pfeiler }] }

  # ----------------------- Parallaxe: große Hintergrund-Sprites (kachelbar)
  # The sky is not a sprite: it is the level's colour backdrop.
  wolke: { label: Wolke, groesse: [64, 24], states: [{ strip: welt/wolke }] }
  berge_fern: { label: Ferne Berge, groesse: [192, 72], states: [{ strip: welt/berge_fern }] }
  berge: { label: Berge, groesse: [192, 72], states: [{ strip: welt/berge }] }
  wald: { label: Wald, groesse: [192, 48], states: [{ strip: welt/wald }] }
  tannen: { label: Tannen, groesse: [192, 64], states: [{ strip: welt/tannen }] }
  tannen_schnee: { label: Verschneite Tannen, groesse: [192, 64], states: [{ strip: welt/tannen_schnee }] }
  schneemann: { label: Schneemann, states: [{ strip: welt/schneemann }] }
  # tall grass that sways a little – something can hide in it
  hohes_gras: { label: Hohes Gras, groesse: [48, 24], states: [{ strip: welt/hohes_gras, fps: 3 }] }
  toter_baum: { label: Toter Baum, groesse: [48, 72], states: [{ strip: welt/toter_baum }] }
  toter_baum_2: { label: Toter Baum (krumm), groesse: [48, 72], states: [{ strip: welt/toter_baum_2 }] }
  toter_baum_3: { label: Toter Baum (schmal), groesse: [48, 72], states: [{ strip: welt/toter_baum_3 }] }
  tote_baeume_fern: { label: Toter Wald (fern), groesse: [192, 64], states: [{ strip: welt/tote_baeume_fern }] }
  vordergrund: { label: Vordergrund, groesse: [192, 32], states: [{ strip: welt/vordergrund }] }

  # ------------------------------------------------ große Schrägen (48x24)
  hang_flach:
    label: Sanfter Hang
    groesse: [48, 24]
    traits: { slope: { direction: positive } }
    states: [{ strip: welt/hang_flach }]
  hang_flach_ab:
    label: Sanfter Hang abwärts
    groesse: [48, 24]
    traits: { slope: { direction: negative } }
    states: [{ strip: welt/hang_flach_ab }]
  # under the low end of a gentle slope: a ground block that carries the grass band on
  hang_fuss:
    label: Hangfuß
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/hang_fuss }]
  hang_fuss_ab:
    label: Hangfuß abwärts
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/hang_fuss_ab }]
  # a steep hill slope (24 × 24) with the same grass band – and its foot pieces
  huegel_steil:
    label: Steiler Hang
    traits: { slope: { direction: positive } }
    states: [{ strip: welt/huegel_steil }]
  huegel_steil_ab:
    label: Steiler Hang abwärts
    traits: { slope: { direction: negative } }
    states: [{ strip: welt/huegel_steil_ab }]
  huegel_steil_fuss:
    label: Fuß (steiler Hang)
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/huegel_steil_fuss }]
  huegel_steil_fuss_ab:
    label: Fuß (steiler Hang abwärts)
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/huegel_steil_fuss_ab }]

  # ------------------------------------------- Haus: Fassade und Möbel
  hausfront: { label: Hausfront, groesse: [192, 72], states: [{ strip: welt/hausfront }] }
  # only the window panes of the Hausfront, warm: lit windows (on a layer with "Leuchten")
  hausfront_licht: { label: Fensterlicht, groesse: [192, 72], states: [{ strip: welt/hausfront_licht }] }
  tisch: { label: Tisch, states: [{ strip: welt/tisch }] }
  eingang: { label: Offene Tür (nur Bild), states: [{ strip: welt/tuer_auf }] }
  pflanze: { label: Pflanze, states: [{ strip: welt/pflanze }] }

  # ------------------------------------- halbdurchsichtige Sprites
  wasser: { label: Wasser, states: [{ strip: welt/wasser }] }
  # all water tiles move in step (phase_r: 0): the waves run on across tiles
  wasser_oben: { label: Wasseroberfläche, states: [{ strip: welt/wasser_oben, fps: 8, phase_r: 0 }] }
  # rain splashes on the ground: every copy starts at a random moment (the default phase)
  regenspritzer: { label: Regenspritzer, states: [{ strip: welt/regenspritzer, fps: 14 }] }
  # mischmodus: leuchten | aufhellen | abdunkeln (the sprite's Mischmodus)
  lichtkegel: { label: Lichtkegel, groesse: [48, 72], mischmodus: leuchten, states: [{ strip: welt/lichtkegel }] }
  laterne: { label: Laterne, groesse: [48, 72], states: [{ strip: welt/laterne }] }
  # the lantern's light at night: much brighter than the Lichtkegel, it pops out of the dark
  laternenlicht: { label: Laternenlicht, groesse: [48, 72], mischmodus: leuchten, states: [{ strip: welt/laternenlicht }] }
  glas: { label: Glasscheibe, mischmodus: abdunkeln, states: [{ strip: welt/glas }] }
  # Mischmodi: one opaque disc – dark rim, orange body, white spot – blended by its layer
  farbkreis: { label: Farbkreis, states: [{ strip: welt/farbkreis }] }
  mauer_fenster:
    label: Mauer mit Fenster
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/mauer_fenster }]
  sterne: { label: Sterne, states: [{ strip: welt/sterne }] }
  # Mischmodi: the glow gets "Leuchten" from its layer, the shadow has its own "Abdunkeln"
  leuchtschein: { label: Lichtschein, groesse: [120, 120], states: [{ strip: welt/leuchtschein }] }
  schatten: { label: Schatten, mischmodus: abdunkeln, states: [{ strip: welt/schatten }] }
  # a wall lantern above a door – lit, and the same one switched off
  wandlampe: { label: Wandlampe, states: [{ strip: welt/wandlampe }] }
  wandlampe_aus: { label: Wandlampe (aus), states: [{ strip: welt/wandlampe_aus }] }
  # soft (dithered) shadow under eaves and overhangs; tiles side by side
  dachschatten: { label: Schatten unterm Dach, mischmodus: abdunkeln, states: [{ strip: welt/dachschatten }] }
  geist:
    label: Geist
    # Leuchten: it glows brightly in the dark room behind the tinted glass
    mischmodus: leuchten
    traits:
      baddie:
        energy: 40
        damage: 0
        vrun: 0.5
        affected_by_gravity: false
        patrols: true
        start_dir: left
        wait_until_seen: false
        ex_left: 0.6
        ex_right: 0.6
        ex_top: 0.8
    states:
      - { strip: welt/geist, fps: 6, traits: { baddie: [right, walk_right] } }

  # --------------------- Küste (Rezept "Farben, die Stimmung machen")
  # Drawn in the studio's default palette (Cling); the recipe converts them.
  leuchtturm: { label: Leuchtturm, groesse: [48, 96], states: [{ strip: kueste/leuchtturm, fps: 2 }] }
  klippe:
    label: Klippe
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: kueste/klippe }]
  fels:
    label: Fels
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: kueste/fels }]
  steg:
    label: Steg
    traits: { block_above: {} }
    states: [{ strip: kueste/steg }]
  stegpfosten: { label: Stegpfosten, states: [{ strip: kueste/pfosten }] }
  meer: { label: Meer, states: [{ strip: kueste/meer, fps: 4, phase_r: 0 }] }
  boot: { label: Boot, groesse: [48, 24], states: [{ strip: kueste/boot, fps: 2 }] }
  # the same boat, 14 px lower: placed in the water row it floats in the water (behind the waves)
  boot_im_wasser: { label: Boot im Wasser, groesse: [48, 38], states: [{ strip: kueste/boot_im_wasser, fps: 2 }] }
  sonne: { label: Sonne, states: [{ strip: kueste/sonne }] }
  schaefchenwolke: { label: Schäfchenwolke, groesse: [48, 24], states: [{ strip: kueste/wolke }] }

  # ------------------------------ Flughafen (Rezept "Förderbänder und Rolltreppen")
  flughafen_boden:
    label: Terminalboden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: flughafen/boden }]
  galerie:
    label: Galerie
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: flughafen/galerie }]
  # a moving walkway: the grooves move 1 px per frame (6 frames), all tiles in step
  laufband:
    label: Laufband
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: flughafen/laufband, fps: 60, phase_r: 0 }]
  laufband_anfang:
    label: Laufband (Anfang)
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: flughafen/laufband_anfang, fps: 60, phase_r: 0 }]
  laufband_ende:
    label: Laufband (Ende)
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: flughafen/laufband_ende, fps: 60, phase_r: 0 }]
  # the escalator: steps, belt and side panel all follow the escalator line, so the
  # tiles continue diagonally without a dent – and so do the pieces below and above
  rolltreppe_flughafen:
    label: Rolltreppe (Flughafen)
    traits: { slope: { direction: positive }, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: flughafen/rolltreppe, fps: 60, phase_r: 0 }]
  rolltreppe_unter:
    label: Rolltreppe (unten drunter)
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: flughafen/rolltreppe_unter }]
  rolltreppe_panel:
    label: Rolltreppe (Seitenwand)
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: flughafen/rolltreppe_panel }]
  rolltreppe_gelaender: { label: Rolltreppe (Geländer), states: [{ strip: flughafen/rolltreppe_gelaender, frames: [0] }] }
  # the top end of the escalator's handrail: it levels out at the gallery rail's height
  rolltreppe_gelaender_oben: { label: Rolltreppe (Geländer oben), states: [{ strip: flughafen/rolltreppe_gelaender_oben }] }
  gelaender: { label: Glasgeländer, states: [{ strip: flughafen/gelaender }] }
  gelaender_anfang: { label: Glasgeländer (Anfang), states: [{ strip: flughafen/gelaender_anfang }] }
  gelaender_ende: { label: Glasgeländer (Ende), states: [{ strip: flughafen/gelaender_ende }] }
  terminalfenster: { label: Terminalfenster, states: [{ strip: flughafen/fenster }] }
  vorfeld: { label: Vorfeld, states: [{ strip: flughafen/vorfeld }] }
  abflugtafel: { label: Abflugtafel, groesse: [48, 24], states: [{ strip: flughafen/abflugtafel, fps: 1 }] }
  gate_schild: { label: Schild zum Gate, states: [{ strip: flughafen/gate_schild }] }
  sitzbank: { label: Sitzreihe, groesse: [48, 24], states: [{ strip: flughafen/sitzbank }] }
  saeule: { label: Säule, states: [{ strip: flughafen/saeule }] }

  # --------------------------------------- Höhle (Rezept "Eine Höhle erkunden")
  hoehle_fels:
    label: Höhlenfels
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: hoehle/fels }]
  hoehle_boden:
    label: Höhlenboden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: hoehle/boden }]
  hoehle_wand: { label: Höhlenwand, states: [{ strip: hoehle/wand }] }
  # the ceiling with a crack of daylight (48 × 24, solid like rock)
  hoehle_spalt:
    label: Felsspalt
    groesse: [48, 24]
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: hoehle/spalt }]
  tropfstein_oben: { label: Tropfstein (hängend), states: [{ strip: hoehle/tropfstein_oben }] }
  tropfstein_unten: { label: Tropfstein (stehend), states: [{ strip: hoehle/tropfstein_unten }] }
  leuchtpilz: { label: Leuchtpilze, states: [{ strip: hoehle/leuchtpilz }] }
  # daylight falling in through the crack: pale and cool (on a layer with "Leuchten")
  lichtschacht: { label: Lichtschacht, groesse: [48, 72], states: [{ strip: hoehle/lichtschacht }] }
  # the mushrooms' light: on a layer with "Leuchten"
  pilzlicht: { label: Pilzlicht, groesse: [72, 72], states: [{ strip: hoehle/pilzlicht }] }
  # the mountain: one picture in two parts, split along a jagged line.
  # The flank with the cave mouth always stays, the front over the cave fades out.
  bergflanke: { label: Berg mit Eingang, groesse: [168, 96], states: [{ strip: hoehle/bergflanke }] }
  bergfront: { label: Berg von außen, groesse: [168, 96], states: [{ strip: hoehle/bergfront }] }
  # at the entrance the ground turns from grass into cave floor (48 × 24, solid)
  hoehle_uebergang_boden:
    label: Übergang Wiese – Höhle
    groesse: [48, 24]
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: hoehle/uebergang_boden }]
  hoehle_uebergang_erde:
    label: Übergang Erde – Fels
    groesse: [48, 24]
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: hoehle/uebergang_erde }]

  # ------------------- Unter Wasser (Rezepte Schwimmen, Fisch und U-Boot)
  # Pip in the water: "Spielfigur schwimmt" (without it she paddles with her walk)
  pip_taucher:
    label: Pip (schwimmt)
    extends: pip
    states:
      - { strip: pip/schwimmen, fps: 8, traits: { actor: [swim_right] } }
      # no key pressed: upright, paddling slowly – and nose down / head up
      - { strip: pip/treiben, fps: 4, traits: { actor: [drift_right] } }
      - { strip: pip/abtauchen, fps: 8, traits: { actor: [dive_right] } }
      - { strip: pip/auftauchen, fps: 8, traits: { actor: [rise_right] } }
  # a fish as the player character: it only swims
  fisch:
    label: Fisch (Spielfigur)
    traits:
      actor: { ex_left: 0.6, ex_right: 0.6, ex_top: 0.75, vjump: 7 }
    states:
      - { strip: meer/fisch, fps: 5, traits: { actor: [right] } }
      - { strip: meer/fisch, fps: 10, traits: { actor: [swim_right] } }
      - { strip: meer/fisch_ab, fps: 10, traits: { actor: [dive_right] } }
      - { strip: meer/fisch_auf, fps: 10, traits: { actor: [rise_right] } }
  # the submarine as the player character (48 × 24): the propeller turns
  u_boot:
    label: U-Boot (Spielfigur)
    groesse: [48, 24]
    traits:
      actor: { ex_left: 0.85, ex_right: 0.85, ex_top: 0.8, vjump: 7 }
    states:
      - { strip: meer/u_boot, fps: 6, traits: { actor: [right] } }
      - { strip: meer/u_boot, fps: 16, traits: { actor: [swim_right] } }
  # a jellyfish (Flatterer: it bobs up and down, gravity does not pull it)
  qualle:
    label: Qualle
    traits:
      baddie:
        energy: 100
        damage: 10
        vrun: 0.15
        start_dir: left
        wait_until_seen: false
        ex_left: 0.6
        ex_right: 0.6
        ex_top: 0.75
        behavior: { type: flutter, height: 20, period: 3.2 }
    states:
      - { strip: meer/qualle, fps: 5, traits: { baddie: [right] } }
  # a shark (48 × 24): a hunter that swims after the player – and stays in the water
  hai:
    label: Hai (Jäger im Wasser)
    groesse: [48, 24]
    traits:
      baddie:
        energy: 100
        damage: 20
        vrun: 1.0
        # swimming enemies: no gravity, so they patrol at their depth
        affected_by_gravity: false
        start_dir: left
        wait_until_seen: false
        ex_left: 0.8
        ex_right: 0.8
        ex_top: 0.7
        behavior: { type: hunter, sight: 168, alert: true, chase: 1.8, forget: 3 }
    states:
      - { strip: meer/hai, fps: 5, traits: { baddie: [right, walk_right, swim_right] } }
      - { strip: meer/hai_jagt, fps: 10, traits: { baddie: [hunt_right] } }
  perle:
    label: Perle
    traits: { pickup: { points: 10 } }
    states: [{ strip: meer/perle, fps: 4 }]
  sand:
    label: Meeresboden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: meer/sand }]
  riff:
    label: Riff
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: meer/fels }]
  seegras: { label: Seegras, groesse: [24, 48], states: [{ strip: meer/seegras, fps: 4 }] }
  # kelp hanging from a rock ceiling, anemones on the reef
  seegras_decke: { label: Seegras an der Decke, states: [{ strip: meer/seegras_decke, fps: 3 }] }
  anemone: { label: Seeanemone, states: [{ strip: meer/anemone, fps: 2 }] }
  # the shore: rocks with grass on top (solid)
  uferfels_oben:
    label: Uferfels (oben)
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: meer/klippe_oben }]
  uferfels:
    label: Uferfels
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: meer/klippe }]
  koralle: { label: Koralle, states: [{ strip: meer/koralle }] }
  koralle_gruen: { label: Grüne Koralle, states: [{ strip: meer/koralle_gruen }] }
  truhe: { label: Schatztruhe, states: [{ strip: meer/truhe }] }
  schlot: { label: Schlot, groesse: [48, 24], states: [{ strip: meer/schlot }] }
  # a soft glow for jellyfish in the deep sea (Leuchten)
  quallenlicht: { label: Quallenlicht, mischmodus: leuchten, states: [{ strip: meer/qualle_licht, fps: 5 }] }

  # --------------------------------------- Weltall (Rezept "Schweben im All")
  astronaut:
    label: Pip im Raumanzug
    traits:
      actor: { ex_left: 0.5, ex_right: 0.5, ex_top: 0.8, vjump: 7 }
    states:
      - { strip: weltall/astronaut_stehen, fps: 3, traits: { actor: [right] } }
      - { strip: weltall/astronaut_laufen, fps: 10, traits: { actor: [walk_right] } }
      - { strip: weltall/astronaut_springen, traits: { actor: [jump_right, fall_right] } }
      # "Spielfigur schwebt": arms and legs apart, bobbing slowly
      - { strip: weltall/astronaut_schweben, fps: 2, traits: { actor: [float_right] } }
  station:
    label: Stationswand
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: weltall/station }]
  station_boden:
    label: Stationsboden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: weltall/station_boden }]
  luke: { label: Luftschleuse, groesse: [24, 48], states: [{ strip: weltall/luke }] }
  bullauge: { label: Bullauge, states: [{ strip: weltall/bullauge }] }
  stern:
    label: Stern
    traits: { pickup: { points: 10 } }
    states: [{ strip: weltall/stern, fps: 6 }]
  satellit: { label: Satellit, groesse: [48, 24], states: [{ strip: weltall/satellit }] }
  planet: { label: Ringplanet, groesse: [72, 72], states: [{ strip: weltall/planet }] }
  erde_planet: { label: Erde, groesse: [48, 48], states: [{ strip: weltall/erde }] }
  mondboden:
    label: Mondboden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: weltall/mondboden }]
  mondgestein:
    label: Mondgestein
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: weltall/mondgestein }]
  mondstein: { label: Mondstein, states: [{ strip: weltall/mondstein }] }

  # ------------------------------------------- Bilder für Angriffe
  pfeil:
    label: Pfeil
    states: [{ strip: welt/pfeil }]
  stein:
    label: Stein
    states: [{ strip: welt/stein }]
  spore:
    label: Spore
    states: [{ strip: welt/spore, fps: 8 }]
  bombe:
    label: Bombe
    traits: { bomb: {} }
    states:
      # 8 frames at 5 fps: the cord burns down within the fuse time (1.6 s)
      - { strip: welt/bombe_zuendschnur, fps: 5, traits: { bomb: [fuse] } }
      - { strip: welt/bombe_explosion, fps: 12, traits: { bomb: [explosion] } }
  treffer_funke:
    label: Treffer-Funke
    states: [{ strip: welt/treffer_funke, fps: 14 }]

  # ---------------------------------- Förderbänder und Rolltreppe (Runde 5)
  # phase_r: 0 → every tile shows the same frame, so the treads line up.
  # 1 px per frame at 60 fps = speed 1 (60 px/s): the treads move exactly as fast as the belt.
  band:
    label: Förderband
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: welt/band, fps: 60, phase_r: 0 }]
  band_anfang:
    label: Förderband (Anfang)
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: welt/band_anfang, fps: 60, phase_r: 0 }]
  band_ende:
    label: Förderband (Ende)
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: welt/band_ende, fps: 60, phase_r: 0 }]
  band_links:
    label: Förderband nach links
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: left, speed: 1.0 } }
    states: [{ strip: welt/band_links, fps: 60, phase_r: 0 }]
  band_links_anfang:
    label: Förderband nach links (Anfang)
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: left, speed: 1.0 } }
    states: [{ strip: welt/band_links_anfang, fps: 60, phase_r: 0 }]
  band_links_ende:
    label: Förderband nach links (Ende)
    traits: { block_above: {}, block_sides: {}, block_below: {}, conveyor: { direction: left, speed: 1.0 } }
    states: [{ strip: welt/band_links_ende, fps: 60, phase_r: 0 }]
  rolltreppe:
    label: Rolltreppe
    traits: { slope: { direction: positive }, conveyor: { direction: right, speed: 1.0 } }
    states: [{ strip: welt/rolltreppe, fps: 60, phase_r: 0 }]
  # under the escalator: its housing goes on (same stripes), so no machine edge cuts in
  rolltreppe_gehaeuse:
    label: Rolltreppe (Gehäuse)
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/rolltreppe_gehaeuse }]
  maschine:
    label: Maschine
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: welt/maschine }]

  # ---------------------------------------- Gegner mit Verhalten (Runde 5)
  kaefer:
    label: Käfer (Jäger)
    traits:
      baddie:
        energy: 40
        damage: 0
        vrun: 0.5
        start_dir: right
        wait_until_seen: false
        ex_left: 0.8
        ex_right: 0.8
        ex_top: 0.55
        behavior: { type: hunter }
    states:
      - { strip: kaefer/laufen, fps: 10, traits: { baddie: [right, walk_right] } }
      - { strip: kaefer/jagen, fps: 16, traits: { baddie: [hunt_right] } }
      - { strip: kaefer/treffer, traits: { baddie: [hit_right] } }
      - { strip: kaefer/tot, fps: 8, traits: { baddie: [dead] } }
  # a straw training dummy – tall enough for arrows and stones, stands still
  strohpuppe:
    label: Strohpuppe (Übungsziel)
    groesse: [24, 32]
    traits:
      baddie:
        energy: 45
        damage: 0
        vrun: 0
        patrols: false
        start_dir: left
        wait_until_seen: false
        ex_left: 0.5
        ex_right: 0.5
        ex_top: 0.95
        behavior: { type: still }
    states:
      - { strip: strohpuppe/stehen, traits: { baddie: [right] } }
      - { strip: strohpuppe/treffer, fps: 12, traits: { baddie: [hit_right] } }
      - { strip: strohpuppe/tot, fps: 8, traits: { baddie: [dead] } }
  # a hay bale for the training ground (solid)
  strohballen:
    label: Strohballen
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: strohpuppe/strohballen }]
  # a raccoon that chases – and climbs, jumps gaps and hops over blocks (Intelligenz)
  waschbaer:
    label: Waschbär (Jäger mit Intelligenz)
    traits:
      baddie:
        energy: 100
        # a little damage: when he catches Pip, she flinches (Treffer) and blinks
        damage: 10
        vrun: 0.9
        vjump: 5.5
        start_dir: right
        wait_until_seen: false
        ex_left: 0.7
        ex_right: 0.7
        ex_top: 0.6
        behavior: { type: hunter, sight: 168, alert: true, chase: 2.0, forget: 5 }
      smart: { climbs_ladders: true, jumps_gaps: true, jumps_obstacles: true, walks_slopes: true }
    states:
      - { strip: waschbaer/stehen, fps: 2, traits: { baddie: [right] } }
      - { strip: waschbaer/laufen, fps: 10, traits: { baddie: [walk_right] } }
      - { strip: waschbaer/jagen, fps: 14, traits: { baddie: [hunt_right] } }
      - { strip: waschbaer/springen, traits: { baddie: [jump_right, fall_right] } }
      - { strip: waschbaer/klettern, fps: 6, traits: { baddie: [climb] } }
  maus:
    label: Maus (Angsthase)
    traits:
      baddie:
        energy: 20
        damage: 0
        vrun: 0.6
        start_dir: left
        wait_until_seen: false
        ex_left: 0.7
        ex_right: 0.7
        ex_top: 0.55
        behavior: { type: coward, alert: true, flee: 6 }
    states:
      - { strip: maus/stehen, traits: { baddie: [right] } }
      - { strip: maus/laufen, fps: 10, traits: { baddie: [walk_right] } }
      - { strip: maus/fliehen, fps: 16, traits: { baddie: [flee_right] } }
      - { strip: maus/tot, fps: 8, traits: { baddie: [dead] } }
  keiler:
    label: Keiler (Lauerer)
    traits:
      baddie:
        energy: 60
        damage: 0
        vrun: 0.6
        start_dir: left
        wait_until_seen: false
        ex_left: 0.8
        ex_right: 0.8
        ex_top: 0.6
        behavior: { type: lurker }
    states:
      - { strip: keiler/stehen, fps: 3, traits: { baddie: [right] } }
      - { strip: keiler/laufen, fps: 16, traits: { baddie: [walk_right] } }
      - { strip: keiler/stuermen, fps: 18, traits: { baddie: [hunt_right] } }
      - { strip: keiler/benommen, fps: 6, traits: { baddie: [stunned_right] } }
      - { strip: keiler/treffer, traits: { baddie: [hit_right] } }
      - { strip: keiler/tot, fps: 8, traits: { baddie: [dead] } }
  frosch:
    label: Frosch (Hüpfer)
    traits:
      baddie:
        energy: 40
        damage: 0
        vrun: 0.6
        vjump: 7.0
        jump_vfactor: 2.0
        start_dir: left
        wait_until_seen: false
        ex_left: 0.7
        ex_right: 0.7
        ex_top: 0.5
        behavior: { type: hopper }
    states:
      - { strip: frosch/stehen, fps: 2, traits: { baddie: [right] } }
      - { strip: frosch/springen, traits: { baddie: [jump_right, fall_right] } }
      - { strip: frosch/treffer, traits: { baddie: [hit_right] } }
      - { strip: frosch/tot, fps: 8, traits: { baddie: [dead] } }
  fledermaus:
    label: Fledermaus (Flatterer)
    traits:
      baddie:
        energy: 20
        damage: 0
        vrun: 0.7
        affected_by_gravity: false
        start_dir: left
        wait_until_seen: false
        ex_left: 0.5
        ex_right: 0.5
        ex_top: 0.6
        behavior: { type: flutter }
    states:
      - { strip: fledermaus/fliegen, fps: 10, traits: { baddie: [right, walk_right] } }
      - { strip: fledermaus/treffer, traits: { baddie: [hit_right] } }
      - { strip: fledermaus/tot, fps: 8, traits: { baddie: [dead] } }
  klotz:
    label: Steinklotz (Stampfer)
    traits:
      baddie:
        energy: 1000
        damage: 0
        vrun: 0.0
        affected_by_gravity: false
        patrols: false
        wait_until_seen: false
        camera_shake_on_land: 4
        behavior: { type: stomper }
    states:
      - { strip: klotz/stehen, traits: { baddie: [front] } }
      - { strip: klotz/fallen, traits: { baddie: [fall_front] } }
      - { strip: klotz/landen, fps: 10, traits: { baddie: [landed_front] } }
      - { strip: klotz/treffer, traits: { baddie: [hit_front] } }
      - { strip: klotz/tot, fps: 8, traits: { baddie: [dead] } }
  klotz_einmal:
    extends: klotz
    label: Steinklotz (fällt nur einmal)
    traits: { baddie: { behavior: { type: stomper, once: true } } }

