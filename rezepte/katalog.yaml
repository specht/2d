  # ------------------- Unter Wasser (Rezepte Schwimmen, Fisch und U-Boot)
  # Pip in the water: "Spielfigur schwimmt" (without it she paddles with her walk)
  pip_taucher:
    label: Pip (schwimmt)
    extends: pip
    states:
      - { strip: pip/schwimmen, fps: 8, traits: { actor: [swim_right] } }
      # no key pressed: upright, paddling slowly – and nose down / head up
      - { strip: pip/treiben, fps: 4, traits: { actor: [drift_right] } }
      - { strip: pip/abtauchen, fps: 8, traits: { actor: [dive_right] } }
      - { strip: pip/auftauchen, fps: 8, traits: { actor: [rise_right] } }
  # a fish as the player character: it only swims
  fisch:
    label: Fisch (Spielfigur)
    schwebt: true
    traits:
      actor: { ex_left: 0.6, ex_right: 0.6, ex_top: 0.75, vjump: 7 }
    states:
      - { strip: meer/fisch, fps: 5, traits: { actor: [right] } }
      - { strip: meer/fisch, fps: 10, traits: { actor: [swim_right] } }
      - { strip: meer/fisch_ab, fps: 10, traits: { actor: [dive_right] } }
      - { strip: meer/fisch_auf, fps: 10, traits: { actor: [rise_right] } }
  # the submarine as the player character (48 × 24): the propeller turns
  u_boot:
    label: U-Boot (Spielfigur)
    schwebt: true
    groesse: [48, 24]
    traits:
      actor: { ex_left: 0.85, ex_right: 0.85, ex_top: 0.8, vjump: 7 }
    states:
      - { strip: meer/u_boot, fps: 6, traits: { actor: [right] } }
      - { strip: meer/u_boot, fps: 16, traits: { actor: [swim_right] } }
  # a jellyfish (Flatterer: it bobs up and down, gravity does not pull it)
  qualle:
    label: Qualle
    schwebt: true
    traits:
      baddie:
        energy: 100
        damage: 10
        vrun: 0.15
        start_dir: left
        wait_until_seen: false
        ex_left: 0.6
        ex_right: 0.6
        ex_top: 0.75
        behavior: { type: flutter, height: 20, period: 3.2 }
    states:
      - { strip: meer/qualle, fps: 5, traits: { baddie: [right] } }
  # a shark (48 × 24): a hunter that swims after the player – and stays in the water
  hai:
    label: Hai (Jäger im Wasser)
    groesse: [48, 24]
    traits:
      baddie:
        energy: 100
        damage: 20
        vrun: 1.0
        # swimming enemies: no gravity, so they patrol at their depth
        affected_by_gravity: false
        start_dir: left
        wait_until_seen: false
        ex_left: 0.8
        ex_right: 0.8
        ex_top: 0.7
        behavior: { type: hunter, sight: 168, alert: true, chase: 1.8, forget: 3 }
    states:
      - { strip: meer/hai, fps: 5, traits: { baddie: [right, walk_right, swim_right] } }
      - { strip: meer/hai_jagt, fps: 10, traits: { baddie: [hunt_right] } }
  perle:
    label: Perle
    traits: { pickup: { points: 10 } }
    states: [{ strip: meer/perle, fps: 4 }]
  sand:
    label: Meeresboden
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: meer/sand }]
  riff:
    label: Riff
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: meer/fels }]
  seegras: { label: Seegras, groesse: [24, 48], states: [{ strip: meer/seegras, fps: 4 }] }
