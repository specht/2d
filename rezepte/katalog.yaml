  # ---------------------------------------- Gegner mit Verhalten (Runde 5)
  kaefer:
    label: Käfer (Jäger)
    traits:
      baddie:
        energy: 40
        damage: 0
        vrun: 0.5
        start_dir: right
        wait_until_seen: false
        ex_left: 0.8
        ex_right: 0.8
        ex_top: 0.55
        behavior: { type: hunter }
    states:
      - { strip: kaefer/laufen, fps: 10, traits: { baddie: [right, walk_right] } }
      - { strip: kaefer/jagen, fps: 16, traits: { baddie: [hunt_right] } }
      - { strip: kaefer/treffer, traits: { baddie: [hit_right] } }
      - { strip: kaefer/tot, fps: 8, traits: { baddie: [dead] } }
  # a straw training dummy – tall enough for arrows and stones, stands still
  strohpuppe:
    label: Strohpuppe (Übungsziel)
    groesse: [24, 48]
    traits:
      baddie:
        energy: 45
        damage: 0
        vrun: 0
        patrols: false
        start_dir: left
        wait_until_seen: false
        ex_left: 0.5
        ex_right: 0.5
        # the picture is 32 px high in a 48 px sprite: the same hitbox as before
        ex_top: 0.6333333
        behavior: { type: still }
    states:
      - { strip: strohpuppe/stehen, traits: { baddie: [right] } }
      - { strip: strohpuppe/treffer, fps: 12, traits: { baddie: [hit_right] } }
      - { strip: strohpuppe/tot, fps: 8, traits: { baddie: [dead] } }
  # a hay bale for the training ground (solid)
  strohballen:
    label: Strohballen
    traits: { block_above: {}, block_sides: {}, block_below: {} }
    states: [{ strip: strohpuppe/strohballen }]
  # a raccoon that chases – and climbs, jumps gaps and hops over blocks (Intelligenz)
  waschbaer:
    label: Waschbär (Jäger mit Intelligenz)
    traits:
      baddie:
        energy: 100
        # a little damage: when he catches Pip, she flinches (Treffer) and blinks
        damage: 10
        vrun: 0.9
        vjump: 5.5
        start_dir: right
        wait_until_seen: false
        ex_left: 0.7
        ex_right: 0.7
        ex_top: 0.6
        behavior: { type: hunter, sight: 168, alert: true, chase: 2.0, forget: 5 }
      smart: { climbs_ladders: true, jumps_gaps: true, jumps_obstacles: true, walks_slopes: true }
    states:
      - { strip: waschbaer/stehen, fps: 2, traits: { baddie: [right] } }
      - { strip: waschbaer/laufen, fps: 10, traits: { baddie: [walk_right] } }
      - { strip: waschbaer/jagen, fps: 14, traits: { baddie: [hunt_right] } }
      - { strip: waschbaer/springen, traits: { baddie: [jump_right, fall_right] } }
      - { strip: waschbaer/klettern, fps: 6, traits: { baddie: [climb] } }
  maus:
    label: Maus (Angsthase)
    traits:
      baddie:
        energy: 20
        damage: 0
        vrun: 0.6
        start_dir: left
        wait_until_seen: false
        ex_left: 0.7
        ex_right: 0.7
        ex_top: 0.55
        behavior: { type: coward, alert: true, flee: 6 }
    states:
      - { strip: maus/stehen, traits: { baddie: [right] } }
      - { strip: maus/laufen, fps: 10, traits: { baddie: [walk_right] } }
      - { strip: maus/fliehen, fps: 16, traits: { baddie: [flee_right] } }
      - { strip: maus/tot, fps: 8, traits: { baddie: [dead] } }
  # unverwundbar: kratzt bei Berührung, aber Angriffe machen ihr nichts
